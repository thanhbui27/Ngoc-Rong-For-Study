name: Deploy Ngoc Rong

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_database_backup:
        description: 'DB already backed up and migrated; deploy without invoking Docker'
        type: boolean
        default: false
        required: false

concurrency:
  group: nro-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SKIP_DATABASE_BACKUP: ${{ inputs.skip_database_backup || false }}
        run: |
          deploy_command='cd /opt/apps/Ngoc-Rong-For-Study && ./deploy.sh'
          if [[ "$SKIP_DATABASE_BACKUP" == true ]]; then
            deploy_command="$deploy_command --skip-database-backup"
          fi
          ssh -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "$deploy_command"
